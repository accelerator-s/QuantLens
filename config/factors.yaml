- name: smooth_uptrend_efficiency_60d
  display_name: 60日温和上涨效率
  assumption: 金融假设：过去约60个交易日（约三个月）价格沿路径平滑上行、日间波动较小，可能反映资金分批进入、持股者分歧低、获利抛压不急，因而未来约20个交易日趋势延续概率较高。因子用60日累计收益除以同期日收益绝对值之和（趋势效率/路径平滑度），既要求净涨幅为正，也惩罚大涨大跌路径；低波动但无上涨趋势的股票该值接近零。失效条件：①相对“低波动但无趋势”对照组无额外超额收益；②扣除交易成本后优势消失；③优势仅集中在流动性差的少数股票；④市场快速上攻、情绪亢奋阶段温和上涨股票明显落后于大涨股票。计算仅使用截至t日及以前的收盘价，不使用未来数据。
  applicable_markets:
