  risk_notes: 该因子由 AI 根据金融现象生成，尚未获得实盘权限。模型自评：用60日累计收益除以同期日收益绝对值之和，直接刻画平滑上行路径；低波动但无趋势的股票该值接近0，便于检验“温和上涨”相对纯低波动的增量解释力。
