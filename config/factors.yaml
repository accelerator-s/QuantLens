- name: lower_shadow_volskew_30d
  display_name: 下影线量能偏度
  assumption: 下影线承接假设：个股出现异常长的下影线，且成交量变化分布偏负（少数放量日主导），同时价格仍高于 30 日均线时，可能代表盘中抛压被承接、筹码交换后继续上行；若该形态只集中在流动性尾部，或扣费后无法跑赢同池等权基准，则假设失效。
  applicable_markets:
  - CN-A
  applicable_instruments:
  - stock
  timescale: daily
  dependencies:
  - open
  - high
  - low
  - close
  - volume
  - amount
  - adj_close_wd
  - is_trading
  - listed_days
  output_frequency: daily
  direction: undecided
  parameters:
    lookback_days: 30
    pool_days: 20
    pool_size: 500
    min_listed_days: 120
  standardization: []
  missing_handling: drop
  ai_generated: false
  production_permission: false
  risk_notes: 下影线是稀疏变量，零值占比高，截面排名会出现大量并列；因子自带成交额前 500 股池，池外为 NaN，超额收益基准仍是策略 universe
    等权，与原始研报的 top500 基准不完全一致；原始版本未做行业/市值中性。
  evaluation_metrics:
  - ic
  - grouped_return
  - coverage
  - turnover
  - decay
  - regime
  status: draft
  version: v1
