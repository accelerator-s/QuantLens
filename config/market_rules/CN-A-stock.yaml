  - condition: 科创板ST
    limit_pct: '20'
    notes: 科创板 ST 股票涨跌幅不变，仍为 ±20%
  - condition: 创业板ST
    limit_pct: '20'
    notes: 创业板 ST 股票涨跌幅不变，仍为 ±20%
  - condition: 北交所ST
    limit_pct: '30'
    notes: 北交所 ST 股票涨跌幅不变，仍为 ±30%
  first_day_rule: 全面注册制（2023年2月起）：沪深主板/科创板/创业板新股上市前 5 个交易日不设涨跌幅限制；北交所新股上市首日不设涨跌幅限制，次日起执行
    ±30%。上市首日设临时停牌机制（科创板/创业板/北交所：盘中涨跌达 ±30% 停牌 10 分钟，达 ±60% 停牌至 14:57）。
  notes: 涨跌停价格 = 前收盘价 × (1 ± 涨跌幅比例)，精确到分（四舍五入）
suspension_handling: 停牌期间不计入交易日；复牌首日按正常涨跌幅限制交易（除特殊规定外）。科创板/创业板/北交所盘中临时停牌：涨跌达 ±30%
  停牌 10 分钟，达 ±60% 停至当日 14:57 复牌。
