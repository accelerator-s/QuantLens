<section class="ai-config">
  <header class="toolbar ai-config__models-head">
    <h3 class="section-title"><span class="icon" data-icon="robot"></span>模型列表</h3>
    <span class="toolbar__spacer"></span>
    <button type="button" class="btn btn--primary" data-model-add>添加模型</button>
  </header>
  <div data-models></div>

  <h3 class="section-title"><span class="icon" data-icon="table"></span>任务配置</h3>
  <div data-matrix></div>

  <h3 class="section-title"><span class="icon" data-icon="radar"></span>模型匹配</h3>
  <div class="toolbar">
    <div class="select ai-config__task-select" data-task-select></div>
    <span class="item-row__meta">选择任务后按任务配置评估各已启用模型的匹配得分。</span>
  </div>
  <div data-route></div>
</section>
