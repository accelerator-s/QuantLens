<header class="topbar">
  <div class="topbar__left">
    <button type="button" class="btn btn--ghost topbar__menu-btn" data-nav-toggle aria-label="展开导航">
      <span data-icon="table"></span>
    </button>
    <span class="topbar__group" data-page-group>行情与选股</span>
    <span class="topbar__sep" aria-hidden="true">/</span>
    <h1 class="topbar__title" data-page-title>工作台</h1>
  </div>
  <div class="topbar__actions">
    <button type="button" class="btn btn--ghost btn--sm" data-assistant-open>研究助手</button>
    <button type="button" class="topbar__health" data-health title="查看后台服务状态" aria-label="查看后台服务状态">
      <span class="topbar__dot"></span>
      <span data-health-label aria-live="polite">连接中</span>
    </button>
    <button type="button" class="btn btn--ghost btn--sm" data-refresh title="刷新当前视图">
      <span data-icon="refresh"></span>
      <span>刷新</span>
    </button>
    <button type="button" class="btn btn--ghost btn--sm" data-theme-toggle aria-label="切换深浅色主题" title="切换深浅色主题">
      <span data-theme-icon data-icon="theme-moon"></span>
    </button>
  </div>
</header>
