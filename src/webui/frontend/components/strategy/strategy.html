<section class="strategy">
  <div class="toolbar">
    <div class="select factors__filter" data-status-select></div>
    <span class="toolbar__spacer"></span>
    <button type="button" class="btn btn--primary" data-research-open>
      <span data-icon="spark"></span>研究新策略
    </button>
  </div>
  <div class="card factors__research-empty library-empty strategy__empty" data-library-empty hidden>
    <span class="research-entry__mark" data-icon="ban" aria-hidden="true"></span>
    <h3>暂无策略</h3>
  </div>
  <div class="split">
    <div class="item-list" data-list></div>
    <div class="strategy__detail" data-detail></div>
  </div>
</section>
