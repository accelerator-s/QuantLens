<section class="factors">
  <div class="toolbar">
    <div class="select factors__filter" data-status-select></div>
    <span class="toolbar__spacer"></span>
    <button type="button" class="btn btn--primary" data-research-open>
      <span data-icon="spark"></span>研究新因子
    </button>
  </div>
  <div class="card factors__research-empty library-empty" data-library-empty hidden>
    <span class="research-entry__mark" data-icon="ban" aria-hidden="true"></span>
    <h3>暂无因子</h3>
    <button type="button" class="btn btn--primary" data-empty-research>
      <span data-icon="spark"></span>研究新因子
    </button>
  </div>
  <div class="split">
    <div class="item-list" data-list></div>
    <div data-detail></div>
  </div>
</section>
