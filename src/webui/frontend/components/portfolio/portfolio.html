<section class="portfolio">
  <div class="toolbar">
    <div class="select portfolio__account-select" data-account-select></div>
    <button type="button" class="btn btn--ghost" data-account-create>创建账户</button>
  </div>

  <div data-account-card></div>
  <div data-empty hidden></div>

  <section class="portfolio__workflow" data-recommendation-workflow hidden aria-label="策略选股">
    <form class="card portfolio__strategy-form" data-recommendation-form>
      <div class="portfolio__strategy-heading">
        <h2>按策略选股</h2>
        <p class="portfolio__hint" data-strategy-hint></p>
      </div>
      <div class="portfolio__strategy-controls">
        <div class="portfolio__strategy-field">
          <span id="portfolio-strategy-label" class="field__label">选择策略</span>
          <div class="select" data-strategy-select aria-labelledby="portfolio-strategy-label"></div>
        </div>
        <button type="submit" class="btn btn--primary" data-recommend-generate disabled>获取选股建议</button>
      </div>
    </form>
    <div data-recommendation-result aria-live="polite" aria-busy="false"></div>
  </section>

  <section class="portfolio__ledger" data-account-ledger hidden aria-label="持仓与交易">
    <article class="card detail-card">
      <div class="portfolio__section-heading">
        <h3>当前持仓</h3>
        <div class="toolbar">
          <button type="button" class="btn btn--ghost" data-holding-add>录入持仓</button>
          <button type="button" class="btn btn--primary" data-trade-add>录入成交</button>
        </div>
      </div>
      <div data-holdings></div>
    </article>
    <article class="card detail-card">
      <div class="portfolio__section-heading">
        <h3>交易记录</h3>
        <button type="button" class="btn btn--ghost" data-trade-undo disabled>撤回上一笔交易</button>
      </div>
      <div data-trades></div>
      <div class="toolbar">
        <span class="item-row__meta" data-trades-count></span>
        <button type="button" class="btn btn--ghost" data-trades-more hidden>加载更多</button>
      </div>
    </article>
  </section>
</section>
