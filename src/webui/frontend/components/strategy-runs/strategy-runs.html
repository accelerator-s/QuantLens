<section class="experiments strategy-runs">
  <article class="card evolution-card">
    <div class="detail-card__head">
      <div><h3>实验会话</h3></div>
      <div class="experiments__session-actions">
        <div class="select experiments__filter" data-session-filter></div>
        <button type="button" class="btn btn--primary" data-evolution-start>新建实验</button>
      </div>
    </div>
    <div data-evolution-list></div>
    <div class="factors__research-empty library-empty experiments__empty" data-experiments-empty hidden>
      <span class="research-entry__mark" data-icon="ban" aria-hidden="true"></span>
      <h3>暂无实验</h3>
    </div>
  </article>
  <div class="experiments__evolution-detail" data-evolution-detail></div>
</section>
