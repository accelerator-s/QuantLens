<section class="factors factors__research">
  <article class="card detail-card">
    <div class="detail-card__head">
      <h3>研究新因子</h3>
      <span class="toolbar__spacer"></span>
      <button type="button" class="btn btn--primary" data-ai-research>
        <span data-icon="spark"></span>讨论研究想法
      </button>
    </div>
    <p class="item-row__meta">从一个金融现象开始讨论。AI 会生成因子名称和初始候选，通过检查后自动进入迭代实验。</p>
  </article>
  <div data-research-empty class="factors__research-empty">
    <h3>从一个想验证的现象开始</h3>
    <p>点击「讨论研究想法」，说明你的观察、预期作用时间和失效条件。</p>
  </div>
  <div data-candidate-task aria-live="polite"></div>
  <div data-research-result></div>
</section>
