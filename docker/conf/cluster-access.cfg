global
    log stdout format raw local0
    maxconn 256

defaults
    mode http
    timeout connect 5s
    timeout http-request 10s
    timeout client 60s
    timeout server 60s

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend cluster-ui
    bind :9870,:8088,:16010,:16030,:18080
    # Public listeners only serve read-only management pages. Browser requests
    # from other sites and DNS rebinding hosts never reach the cluster.
    acl local_host hdr(host) -m reg ^(127\.0\.0\.1|localhost):(9870|8088|16010|16030|18080)$
    acl read_only method GET HEAD
    acl origin_present req.hdr_cnt(origin) gt 0
    acl cross_site req.hdr(sec-fetch-site) -m str cross-site
    acl same_site req.hdr(sec-fetch-site) -m str same-site
    acl navigation req.hdr(sec-fetch-mode) -m str navigate
    acl webhdfs path_beg -i /webhdfs
    acl upgrade req.hdr_cnt(upgrade) gt 0
    http-request deny unless local_host
    http-request deny unless read_only
    http-request deny if origin_present
    http-request deny if cross_site
    http-request deny if same_site !navigation
    http-request deny if webhdfs
    http-request deny if upgrade
    http-response del-header Access-Control-Allow-Origin
    http-response del-header Access-Control-Allow-Credentials
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-Frame-Options DENY
    http-response set-header Referrer-Policy no-referrer
    http-response set-header Cache-Control no-store
    use_backend hdfs-ui if { dst_port 9870 }
    use_backend yarn-ui if { dst_port 8088 }
    use_backend hbase-master-ui if { dst_port 16010 }
    use_backend hbase-region-ui if { dst_port 16030 }
    use_backend spark-history if { dst_port 18080 }

backend hdfs-ui
    server target nn-rm:9870 check resolvers docker init-addr none
backend yarn-ui
    server target nn-rm:8088 check resolvers docker init-addr none
backend hbase-master-ui
    server target hbase:16010 check resolvers docker init-addr none
backend hbase-region-ui
    server target hbase:16030 check resolvers docker init-addr none
backend spark-history
    server target spark-history:18080 check resolvers docker init-addr none

# The containing host directory is 0700 and the socket is 0600. Only the
# application owner's native processes can use the HBase read/write API.
listen hbase-rest
    bind /run/quantlens/hbase.sock mode 600
    http-request deny if { req.hdr_cnt(origin) gt 0 }
    http-request deny if { req.hdr_cnt(sec-fetch-site) gt 0 }
    server target hbase:16050 check resolvers docker init-addr none
