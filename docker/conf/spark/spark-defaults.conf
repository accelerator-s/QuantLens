spark.master yarn
spark.submit.deployMode client
spark.driver.host spark-client
spark.driver.bindAddress 0.0.0.0
spark.executor.memory 1536m
spark.executor.memoryOverhead 384m
spark.executor.cores 2
spark.executor.instances 2
spark.sql.shuffle.partitions 64
spark.sql.adaptive.enabled true
spark.pyspark.python /opt/python/bin/python
spark.pyspark.driver.python /opt/python/bin/python
spark.yarn.appMasterEnv.PYTHONPATH /workspace/src:/workspace
spark.executorEnv.PYTHONPATH /workspace/src:/workspace
spark.yarn.appMasterEnv.JAVA_HOME /usr/lib/jvm/java-17
spark.executorEnv.JAVA_HOME /usr/lib/jvm/java-17
spark.eventLog.enabled true
spark.eventLog.dir hdfs:///spark-events
spark.history.fs.logDirectory hdfs:///spark-events
spark.sql.catalogImplementation hive
spark.sql.hive.metastore.version 3.1.3
spark.sql.hive.metastore.jars path
spark.sql.hive.metastore.jars.path file:///opt/hive/lib/*
spark.sql.parquet.compression.codec snappy
spark.sql.execution.arrow.pyspark.enabled true
spark.python.worker.memory 512m
spark.sql.files.maxPartitionBytes 134217728
spark.sql.sources.partitionOverwriteMode dynamic
spark.sql.session.timeZone Asia/Shanghai
spark.hadoop.hive.metastore.uris thrift://hive:9083

spark.driver.memory 2g
spark.sql.ui.retainedExecutions 20
spark.ui.retainedJobs 50
spark.ui.retainedStages 100
spark.sql.maxPlanStringLength 8192
